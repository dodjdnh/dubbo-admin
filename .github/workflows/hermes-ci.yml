name: Hermes personal CI
run-name: "Hermes ${{ inputs.suite }} ${{ inputs.branch }} @ ${{ inputs.sha }} [${{ inputs.request }}]"
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Check suite
        required: true
        default: basic
        type: choice
        options: [basic, extended]
      branch:
        description: Trusted personal Fork branch
        required: true
        type: string
      sha:
        description: Immutable full commit SHA from that branch
        required: true
        type: string
      request:
        description: Windows controller request ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'dodjdnh/dubbo-admin' && github.actor == 'dodjdnh' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux, x64, hermes-ci, 'hermes-${{ github.run_id }}-${{ github.run_attempt }}']
    timeout-minutes: 120
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
      NODE_OPTIONS: --max-old-space-size=2048
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate dispatch
        env:
          TEST_SHA: ${{ inputs.sha }}
          TEST_BRANCH: ${{ inputs.branch }}
        run: |
          [[ "$TEST_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TEST_BRANCH" =~ ^(main|develop|(feat|fix|feature|test|docs|refactor|chore)/[a-zA-Z0-9._/-]+)$ ]]
      - name: Checkout exact tested SHA
        env:
          TEST_SHA: ${{ inputs.sha }}
        run: |
          git init .
          git fetch /opt/source.bundle '+refs/oss-ci/*:refs/oss-ci/*'
          git checkout --detach "$TEST_SHA"
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
      - name: Record source identity
        env:
          TEST_SHA: ${{ inputs.sha }}
          TEST_BRANCH: ${{ inputs.branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          printf '### Tested source\nRepository: %s\n\nBranch: %s\n\nSHA: `%s`\n\nRunner: `%s`\n' "$GITHUB_REPOSITORY" "$TEST_BRANCH" "$TEST_SHA" "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: License
        id: license
        timeout-minutes: 10
        continue-on-error: true
        uses: apache/skywalking-eyes/header@5c28835454eb069b7a4667430f2c40a3d5a9912c
        with:
          config: .licenserc.yaml
          mode: check
          token: ''
      - name: Setup Node 18
        id: node
        timeout-minutes: 15
        continue-on-error: true
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
      - name: Frontend dependencies
        id: install
        timeout-minutes: 30
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        continue-on-error: true
        working-directory: ui-vue3
        run: yarn install --frozen-lockfile
      - name: Vue Build
        id: vue
        timeout-minutes: 30
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        working-directory: ui-vue3
        run: |
          yarn build
          git diff --exit-code -- .
      - name: Copy frontend assets
        id: assets
        if: ${{ !cancelled() && steps.vue.outcome == 'success' }}
        continue-on-error: true
        run: cp -r ui-vue3/dist/ app/dubbo-ui/
      - name: Setup project Go
        id: go
        env:
          # License's setup-go leaves 'local'; allow go.mod toolchain selection.
          GOTOOLCHAIN: auto
        timeout-minutes: 15
        continue-on-error: true
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Go Format (clean source worktree)
        id: format
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        continue-on-error: true
        run: |
          git worktree add --detach "$RUNNER_TEMP/format" HEAD
          cd "$RUNNER_TEMP/format"
          make fmt
          git status --short
          test -z "$(git status --short)"
      - name: Go Unit Test and coverage
        id: unit
        timeout-minutes: 45
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.assets.outcome == 'success' }}
        continue-on-error: true
        run: make test
      - name: Linux RISC-V cross build
        id: riscv
        if: ${{ !cancelled() && inputs.suite == 'extended' && steps.go.outcome == 'success' && steps.assets.outcome == 'success' }}
        timeout-minutes: 30
        continue-on-error: true
        env:
          GOOS: linux
          GOARCH: riscv64
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Collector 0.112.0 release OTTL contract
        id: collector
        if: ${{ !cancelled() && inputs.suite == 'extended' }}
        timeout-minutes: 10
        continue-on-error: true
        run: |
          /opt/ci-python/bin/python --version
          /opt/ci-python/bin/python -c 'import yaml; assert yaml.__version__ == "6.0.2"'
          /opt/ci-tools/otelcol-contrib --version
          /opt/ci-python/bin/python scripts/verify-trace-metric-collector.py --collector /opt/ci-tools/otelcol-contrib
      - name: Preserve coverage on Hermes
        id: coverage
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, time
          root = pathlib.Path('/home/runner/cache/reports')
          root.mkdir(exist_ok=True)
          dest = root / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          dest.mkdir(exist_ok=True)
          src = pathlib.Path('coverage.txt')
          assert src.is_file() and src.stat().st_size > 0
          shutil.copyfile(src, dest / src.name)
          files = {src.name: hashlib.sha256(src.read_bytes()).hexdigest()}
          (dest / 'manifest.json').write_text(json.dumps({'sha': os.environ['TEST_SHA'], 'url': os.environ['RUN_URL'], 'files': files}, indent=2))
          for i, p in enumerate(sorted(root.iterdir(), key=lambda p: p.stat().st_mtime, reverse=True)):
              if p.is_dir() and not p.is_symlink() and (i >= 20 or p.stat().st_mtime < time.time() - 14*86400):
                  shutil.rmtree(p)
          print('Coverage saved on Hermes:', dest.name, json.dumps(files))
          PY
        env:
          TEST_SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Coverage artifact (optional GitHub mirror)
        id: upload
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ inputs.sha }}
          path: coverage.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Report and enforce every required check
        if: ${{ always() }}
        env:
          RESULTS: ${{ toJSON(steps) }}
          SUITE: ${{ inputs.suite }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ['RESULTS'])
          required = ['license', 'node', 'install', 'vue', 'assets', 'go', 'format', 'unit', 'coverage']
          if os.environ['SUITE'] == 'extended':
              required += ['riscv', 'collector']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n| Check | Outcome |\n|---|---|\n')
              for k in required:
                  f.write(f"| {k} | {s.get(k, {}).get('outcome', 'not run')} |\n")
              f.write(f"| optional GitHub artifact mirror | {s.get('upload', {}).get('outcome', 'not run')} |\n")
              f.write('\nCoverage is retained on Hermes (latest 20 runs, up to 14 days, subject to CI cache budget). GitHub mirror failure is a reporting limitation, not a test pass.\n')
              f.write('\nCodecov upload: not configured. This is one go.mod-selected toolchain, not a Go-version matrix.\n')
          raise SystemExit(any(s.get(k, {}).get('outcome') != 'success' for k in required))
          PY
